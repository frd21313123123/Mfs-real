[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "realflow-traffic"
version = "0.2.0a1"
description = "MSFS 2020 hybrid live and simulated traffic prototype using local FSLTL models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="RealFlow Traffic Contributors"}]
dependencies = []

[project.scripts]
realflow = "realflow.cli:main"

[tool.setuptools.packages.find]
include = ["realflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
