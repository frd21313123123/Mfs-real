name: Windows prototype EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Smoke test
        run: python -m realflow demo --steps 240 --output demo-results.json
      - name: Package prototype UI
        run: pyinstaller --clean --noconfirm --onefile --windowed --name RealFlowTraffic --add-data "examples/demo_airport.json;examples" realflow_gui.py
      - name: Upload Windows EXE and smoke output
        uses: actions/upload-artifact@v4
        with:
          name: RealFlowTraffic-Windows-prototype-${{ github.run_number }}
          path: |
            dist/RealFlowTraffic.exe
            demo-results.json
          if-no-files-found: error
          retention-days: 30
