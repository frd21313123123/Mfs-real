name: Native Rust CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --all-targets --target ${{ matrix.target }}
      - run: cargo test --locked --no-default-features --target ${{ matrix.target }}
      - run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Native CLI smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          target/x86_64-unknown-linux-gnu/release/realflow doctor
          target/x86_64-unknown-linux-gnu/release/realflow demo --steps 240 --output target/demo-results.json
          target/x86_64-unknown-linux-gnu/release/realflow atc-demo --steps 600 --output target/atc-demo-results.json
      - name: Native CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\target\x86_64-pc-windows-msvc\release\realflow.exe doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\x86_64-pc-windows-msvc\release\realflow.exe demo --steps 240 --output target/demo-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\x86_64-pc-windows-msvc\release\realflow.exe atc-demo --steps 600 --output target/atc-demo-results.json
          exit $LASTEXITCODE
      - name: Package standalone Linux binaries
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh "$PWD/target/x86_64-unknown-linux-gnu/release"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: RealFlow-Linux-x64-${{ github.run_number }}
          path: |
            release/RealFlow-Linux-x64.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ runner.os }}
          path: |
            target/demo-results.json
            target/atc-demo-results.json
          if-no-files-found: error
