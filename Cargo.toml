[package]
name = "realflow-traffic"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Native RealFlow traffic and ATC prototype for MSFS 2020"

[lib]
name = "realflow"

[[bin]]
name = "realflow"
path = "src/bin/realflow.rs"

[[bin]]
name = "realflow-launcher"
path = "src/bin/launcher.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:sha2", "dep:base64", "dep:tempfile"]

[dependencies]
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
tempfile = { version = "3", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
roxmltree = "0.20"
walkdir = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
ctrlc = "3"
libloading = "0.8"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Media_Speech", "Win32_Media_Audio", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
